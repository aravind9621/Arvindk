<!DOCTYPE html>
<html>
<head>
  <title>Background Color Changer</title>
  <style>
    body{
      min-height:100px;
      display:flex;
      align-items:center;
      justify-content:center;
      background-color:pink;
      transition: background-color 0.4s ease;
      padding: 20px;
    }
    .container{
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px gray;
      text-align: center;
      max-width: 500px;
      width: 100%;
    }
    h1{
      margin-bottom: 10px;
      font-size: 28px;
    }
    p{
      margin-bottom: 25px;
    }
    .selected-color{
      display: inline-block;
      background: white;
      border: 1px solid black;
      padding: 10px 16px;
      margin-bottom: 25px;
      font-weight: bold;
    }
    .buttons{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:12px;
    }
    button{
      border:none;
      color:white;
      padding:12px 22px;
      font-size:16px;
      font-weight:bold;
      border-radius:10px;
      cursor:pointer;
      transition:transform 0.2s ease, opacity 0.2s ease;
    }
    .red{
      background-color:red;
    }
    .green{
      background-color:green;
    }
    .blue{
      background-color:blue;
    }
    .yellow{
      background-color:Yellow;
    }
    .random{
      background-color:gray;
    }
    .reset{
      background-color: black;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Background Color Changer</h1>
    <p>Click a button to change the background color</p>
    <div class="selected-color">
      Selected color: <span id="colorName">Default</span>
    </div>
    <div class="buttons">
      <button class="red" data-color="Red">Red</button>
      <button class="green" data-color="Green">Green</button>
      <button class="blue" data-color="Blue">Blue</button>
      <button class="yellow" data-color="Yellow">Yellow</button>
      <button class="random" id="randomBtn">Random Color</button>
      <button class="reset" id="resetBtn">Reset</button>
    </div>
  </div>
  <script>
    const originalColor = "white";
    const colorName = document.getElementById("colorName");
    const colorButtons = document.querySelectorAll("[data-color]");
    const randomButton = document.getElementById("randomBtn");
    const resetButton = document.getElementById("resetBtn");
    function changeBackgroundColor(color, name) {
      document.body.style.backgroundColor = color;
      colorName.textContent = name;
    }
    function getRandomColor(){
      const letters = "0123456789ABCDEF";
      let color = "#";
      for (let i = 0; i < 6; i++){
        color += letters[Math.floor(Math.random()*16)];
      }
      return color;
    }
    colorButtons.forEach(function (button){
      button.addEventListener("click",function(){
        const selectedColor = button.dataset.color.toLowerCase();
        changeBackgroundColor(selectedColor,button.dataset.color);
      });
    });
    randomButton.addEventListener("click",function(){
      const randomColor = getRandomColor();
      changeBackgroundColor(randomColor,randomColor);
    });
    resetButton.addEventListener("click",function(){
      changeBackgroundColor(originalColor,"Default");
    });
  </script>
</body>
</html>
