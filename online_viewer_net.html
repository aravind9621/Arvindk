<!DOCTYPE html>
<html>
<head>
  <title>Responsive Profile Cards</title>
  <style>
    body{
      margin: 0;
      padding: 32px 16px;
      font-family:Verdana;
      color: black;
      background: Pink;
    }
    h1{
      margin: 0 0 24px;
      text-align: center;
    }
    .card-section {
      max-width: 1000px;
      margin: 0 auto;
    }
  .card-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: stretch;
      gap: 20px;
    }
    .profile-card {
      width: 280px;
      padding: 24px;
      text-align: center;
      background: white;
      box-shadow: 0 4px 14px gray;
    }
    .profile-card img {
      width: 110px;
      height: 110px;
      object-fit: cover;
    }
    .profile-card h2 {
      margin: 14px 0 6px;
      font-size: 20px;
    }
    .profile-card p {
      margin: 8px 0;
      line-height: 15px;
    }
    .role {
      color: gray;
    }
    .profile-card a,
    .show-button {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 16px;
      color: white;
      background: blue;
      border: 0;
      font: inherit;
      text-decoration: none;
    }
    .show-button {
      display: block;
      margin: 24px auto 0;
    }
    .extra-card {
      display: none;
    }
    .extra-card.visible {
      display: block;
    }
    .dark {
      color: green;
      background:red;
    }
    .dark .profile-card {
      color: purple;
      background: red;
    }
    .dark .role {
      color:brown;
    }
    @media (max-width: 600px) {
      body {
        padding: 24px 14px;
      }
      .profile-card {
        width: 100%;
        max-width: 360px;
      }
    }
  </style>
</head>
<body>
  <main class="card-section">
    <h1>Our Team</h1>
    <div class="card-container">
      <article class="profile-card">
          <img src="https://static.vecteezy.com/system/resources/thumbnails/036/230/794/small_2x/ai-generated-vibrant-raindrop-sphere-reflects-nature-beauty-in-abstract-free-photo.jpg">
        <h2>ARAVIND</h2>
        <p class="role">Frontend Developer</p>
        <p>Enjoys building simple, user-friendly websites.</p>
        <a href="mailto:ARAVIND@example.com">Contact</a>
      </article>
      <article class="profile-card">
        <img src="https://static.vecteezy.com/system/resources/thumbnails/036/230/794/small_2x/ai-generated-vibrant-raindrop-sphere-reflects-nature-beauty-in-abstract-free-photo.jpg">
        <h2>Kumar</h2>
        <p class="role">CSS</p>
        <p>making colorful webpage.</p>
        <a href="mailto:kumar@example.com">Contact</a>
      </article>
      <article class="profile-card extra-card">
        <img src="https://static.vecteezy.com/system/resources/thumbnails/036/230/794/small_2x/ai-generated-vibrant-raindrop-sphere-reflects-nature-beauty-in-abstract-free-photo.jpg">
        <h2>Singh</h2>
        <p class="role">JavaScript</p>
        <p>making interactive webpage.</p>
        <a href="mailto:Singh@example.com">Contact</a>
      </article>
    </div>
    <button
      class="show-button"
      id="showButton"
      type="button"
      aria-expanded="false">
      Show more
    </button>
  </main>
  <script>
    const showButton = document.querySelector("#showButton");
    const extraCard = document.querySelector(".extra-card");
    showButton.addEventListener("click", function () {
      const isVisible = extraCard.classList.toggle("visible");
      showButton.textContent = isVisible ? "Show less" : "Show more";
      showButton.setAttribute("aria-expanded", isVisible);
    });
  </script>
</body>
</html>
