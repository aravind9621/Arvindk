<!DOCTYPE html>
<html>
<head>
  <title>My Counter App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family:Verdana;
    }
    body {
      margin: 50px 0px 0px 0px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
    }
    .container {
      background: Pink;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px gray;
      width: 90%;
      max-width: 420px;
    }
    h1 {
      margin-bottom: 25px;
      color: black;
    }
    #counter {
      font-size: 70px;
      font-weight: bold;
      margin-bottom: 30px;
      color: black;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: white;
    }
    .increase {
      background:skyblue;
    }
    .decrease {
      background: yellow;
    }
    .reset {
      background: red;
    }
    .increase-five {
      background: green;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Counter App</h1>
    <p id="counter" class="zero">0</p>
    <div class="buttons">
      <button id="increase" class="increase">Increase</button>
      <button id="decreaseNo" class="decrease">Decrease</button>
      <button id="resetNo" class="reset">Reset</button>
      <button id="increase5No" class="increase-five">Increase by 5</button>
    </div>
  </div>
  <script>
    let count = 0;
    const counter = document.getElementById("counter");
    const increase = document.getElementById("increase");
    const decreaseNo = document.getElementById("decreaseNo");
    const resetNo = document.getElementById("resetNo");
    const increase5No = document.getElementById("increase5No");
    function updateCounter() {
      counter.textContent = count;
      if (count > 0) {
        counter.className = "positive";
      } else if (count < 0) {
        counter.className = "negative";
      } else {
        counter.className = "zero";
      }
    }
    increase.addEventListener("click",function(){
      count++;
      updateCounter();
    });
    decreaseNo.addEventListener("click",function(){
      if (count > 0){
        count--;
      }
      updateCounter();
    });
    resetNo.addEventListener("click",function(){
      count = 0;
      updateCounter();
    });
    increase5No.addEventListener("click",function(){
      count += 5;
      updateCounter();
    });
    updateCounter();
  </script>
</body>
</html>
