<!DOCTYPE html>
<html>
<head>
  <title>Guess the Number!</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body{
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .game-card {
      background:pink;
      width: 100%;
      max-width: 420px;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 15px 35px gray;
      text-align: center;
    }
    h1{
      color: black;
      font-size: 28px;
      margin-bottom: 10px;
    }
    .instruction{
      color: black;
      font-size: 16px;
      margin-bottom: 20px;
    }
    input[type="number"]{
      width:100%;
      padding:12px;
      font-size:18px;
      text-align:center;
      outline: none;
      margin-bottom:15px;
    }
    button{
      width:100%;
      padding:12px;
      font-size:17px;
      font-weight:bold;
      color: white;
      background:blue;
      border: none;
      cursor:pointer;
      transition:transform 0.2s ease, background 0.2s ease;
    }
    #playAgainBtn{
      background:green;
      margin-top: 10px;
      display: none;
    }
    .message{
      min-height: 30px;
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      padding: 10px;
    }
    .success{
      color: white;
      background: purple;
    }
    .error {
        color: red;
      background: white;
    }
  </style>
</head>
<body>
  <div class="game-card">
    <h1>Guess the Number</h1>
    <p class="instruction">Guess a number between 0 and 100.</p>
    <input type="number" id="guessInput" min="0" max="100" placeholder="Enter your guess" />
    <button id="checkBtn">Check Guess</button>
    <button id="playAgainBtn">Play Again</button>
    <p id="message" class="message info">Make your first guess</p>
  </div>
  <script>
    const guessInput = document.getElementById("guessInput");
    const checkBtn = document.getElementById("checkBtn");
    const playAgainBtn = document.getElementById("playAgainBtn");
    const message = document.getElementById("message");
    let secretNumber = generateRandomNumber();
    function generateRandomNumber(){
      return Math.floor(Math.random()*100)+1;
    }
    function showMessage(text, type){
      message.textContent = text;
      message.className = "message " +type;
    }
    function checkGuess(){
      const guess = Number(guessInput.value);
      if (!guess || guess < 0 || guess > 100){
        showMessage("Please enter a number between 0 and 100.", "error");
        return;
      }
      if (guess > secretNumber) {
        showMessage("Too High!", "error");
      } else if (guess < secretNumber) {
        showMessage("Too Low!", "error");
      } else {
        showMessage("Correct! You Won!", "success");
        checkBtn.style.display = "none";
        playAgainBtn.style.display = "block";
      }
      guessInput.value = "";
      guessInput.focus();
    }
    function restartGame(){
      secretNumber = generateRandomNumber();
      showMessage("Make your first guess!", "info");
      checkBtn.style.display = "block";
      playAgainBtn.style.display = "none";
      guessInput.value = "";
      guessInput.focus();
    }
    checkBtn.addEventListener("click",checkGuess);
    playAgainBtn.addEventListener("click",restartGame);
    guessInput.addEventListener("keydown",function(event){
      if (event.key === "Enter") {
        checkGuess();
      }
    });
  </script>
</body>
</html>
