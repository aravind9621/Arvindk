<!DOCTYPE html>
<html>
<head>
  <title>Simple Calculator</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }
    body{
      height:600px;
      display:flex;
      justify-content:center;
      align-items:center;
      background-color:darkslategray;
    }
    .calculator{
      width:320px;
      background-color:white;
      padding:15px;
      border-radius:15px;
      box-shadow:5px 5px 15px black;
    }
    .display{
      background-color:black;
      color:white;
      height:80px;
      margin-bottom:15px;
      padding:10px;
      text-align:right;
      font-size:28px;
      overflow:hidden;
    }
    .buttons{
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:10px;
    }
    button{
      padding:15px;
      font-size:18px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      background-color:lightgray;
    }
    .operator{
      background-color:orange;
      color:white;
    }
    .equals{
      background-color:green;
      color:white;
    }
    .clear{
      background-color:red;
      color:white;
    }
    .backspace{
      background-color:gray;
      color:white;
    }
    .zero{
      grid-column:span 2;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">AC</button>
      <button class="backspace" onclick="backspace()">⌫ cancel</button>
      <button class="operator" onclick="appendValue('/')">÷</button>
      <button class="operator" onclick="appendValue('*')">×</button>
      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('-')">−</button>
      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="operator" onclick="appendValue('+')">+</button>
      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button class="equals" onclick="calculate()">=</button>
      <button class="zero" onclick="appendValue('0')">0</button>
      <button onclick="appendValue('.')">.</button>
    </div>
  </div>
  <script>
    let display = document.getElementById("display");
    let expression = "";
    function appendValue(value) {
      if (expression === "" && (value === "+" || value === "-" || value === "*" || value === "/")){
        return;
      }
      if (value === "." && expression.includes(".")){
        let lastPart = expression.split(/[^0-9.]/).pop();
        if (lastPart.includes(".")){
          return;
        }
      }
      expression += value;
      display.innerText = expression;
    }
    function calculate() {
      if (expression === "") {
        return;
      }
      try {
        let result = eval(expression);

        if (result === Infinity || result === -Infinity){
          display.innerText = "Cannot divide by zero";
          expression = "";
          return;
        }
        display.innerText = result;
        expression = result.toString();
      } catch (error) {
        display.innerText = "Error";
        expression = "";
      }
    }
    function clearDisplay(){
      expression = "";
      display.innerText = "0";
    }
    function backspace(){
      expression = expression.slice(0, -1);
      if (expression === ""){
        display.innerText = "0";
      } else {
        display.innerText = expression;
      }
    }
  </script>
</body>
</html>
