<!DOCTYPE html>
<html>
<head>
  <title>Live Character Counter</title>
  <style>
    *{
      box-sizing: border-box;
    }
    body{
      margin: 0;
      min-height: 400px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: aliceblue;
      color: midnightblue;
    }
    .container{
      width: 100%;
      max-width: 500px;
      padding: 30px;
      background-color: white;
      border: 1px solid lightblue;
      border-radius: 15px;
      box-shadow: 0 8px 20px lightgray;
    }
    h1{
      margin-top: 0;
      text-align: center;
      color: royalblue;
      font-size: 28px;
    }
    .description{
      text-align: center;
      color: dimgray;
      line-height: 1.5;
    }
    label{
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }
    textarea{
      width: 100%;
      min-height: 160px;
      padding: 15px;
      border: 2px solid lightblue;
      border-radius: 10px;
      font: inherit;
      resize: vertical;
    }
    textarea:focus{
      outline: 2px solid royalblue;
      outline-offset: 2px;
    }
    .stats{
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      margin-top: 15px;
    }
    .stats p{
      margin: 0;
    }
    #characterCounter{
      color: green;
      font-weight: bold;
    }
    #characterCounter.near-limit{
      color: darkorange;
    }
    #characterCounter.at-limit{
      color: red;
    }
    .remaining{
      color: dimgray;
    }
    #warning{
      min-height: 24px;
      margin: 15px 0;
      color: red;
      font-weight: bold;
    }
    button{
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: royalblue;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:focus-visible {
      outline: 3px solid orange;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Live Character Counter</h1>
    <p class="description">
      Type your message below. Maximum limit: 100 characters.
    </p>
    <label for="textInput">Your message</label>
    <textarea id="textInput" maxlength="100" placeholder="Start typing here..." aria-describedby="remainingText warning"></textarea>
    <div class="stats">
      <p id="characterCounter">
        Characters: <span id="characterCount">0</span> / 100
      </p>
      <p>
        Words:
        <span id="wordCount">0</span>
      </p>
    </div>
    <p id="remainingText" class="remaining">
      Remaining characters: <span id="remainingCount">100</span>
    </p>
    <p id="warning" role="status" aria-live="polite"></p>
    <button id="clearButton" type="button">Clear Text</button>
  </main>
  <script>
    const textInput = document.getElementById("textInput");
    const characterCount = document.getElementById("characterCount");
    const wordCount = document.getElementById("wordCount");
    const remainingCount = document.getElementById("remainingCount");
    const characterCounter = document.getElementById("characterCounter");
    const warning = document.getElementById("warning");
    const clearButton = document.getElementById("clearButton");
    const maxCharacters = 100;
    function updateCounts() {
      const text = textInput.value;
      const characters = text.length;
      const trimmedText = text.trim();
      const words = trimmedText === "" ? 0 : trimmedText.split(/\s+/).length;
      const remaining = maxCharacters - characters;
      characterCount.textContent = characters;
      wordCount.textContent = words;
      remainingCount.textContent = remaining;
      characterCounter.classList.toggle(
        "near-limit",  characters >= 80 && characters < maxCharacters
      );
      characterCounter.classList.toggle( "at-limit", characters >= maxCharacters
      );
      if(characters >= maxCharacters){ warning.textContent = "You have reached the 100-character limit!";
      } 
      else if(characters >= 80){warning.textContent = "You are getting close to the character limit.";
      } 
      else { warning.textContent = "";
      }
    }
    textInput.addEventListener("input", updateCounts);
    clearButton.addEventListener("click", function () {
      textInput.value = "";
      updateCounts();
      textInput.focus();
    });
    updateCounts();
  </script>
</body>
</html>
